<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1457c4">
<meta name="robots" content="noindex, nofollow">
<title>Login Kasir | Hybrid Parking</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/assets/kasir.webmanifest">
<link rel="apple-touch-icon" href="/assets/kasir-icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#17345f;background:#f4f8ff;user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;cursor:pointer}
.shell{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100vh;height:100dvh}

/* kiri: panel biru */
.side{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:64px 48px 0;color:#fff;
background:radial-gradient(600px 460px at 15% 10%,rgba(77,163,255,.55),transparent 65%),radial-gradient(520px 420px at 95% 75%,rgba(198,166,106,.22),transparent 65%),linear-gradient(155deg,#0f2a57,#1457c4)}
.side::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}
.side>*{position:relative}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:#f0d9a0}
.kicker::before,.kicker::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,#f0d9a0)}
.kicker::after{transform:scaleX(-1)}
.side h2{margin:18px 0 0;font-size:46px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.side h2::after{content:"";display:block;width:60px;height:3px;margin:20px auto 0;border-radius:3px;background:linear-gradient(90deg,#c6a66a,#f6e6b8,#c6a66a)}
.side p{margin:20px auto 0;max-width:360px;font-size:16px;line-height:1.6;color:#d4e6ff}
.scene{display:block;width:calc(100% + 96px);margin:0 -48px;height:auto;max-height:34%}
.car{animation:drive 7s ease-in-out infinite alternate}
@keyframes drive{from{transform:translateX(-8px)}to{transform:translateX(16px)}}
@media (prefers-reduced-motion:reduce){.car{animation:none}}

/* kanan: form PIN */
.main{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 32px 56px;text-align:center;
background:radial-gradient(500px 400px at 100% 0,rgba(21,200,165,.1),transparent 65%),linear-gradient(180deg,#f9fbff,#eef4fd)}
.box{width:100%;max-width:380px}
.logo{display:block;width:min(260px,70%);height:auto;margin:0 auto 22px}
.hello{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#1457c4}
h1{margin:8px 0 4px;font-size:30px;font-weight:700;color:#10244a}
.sub{margin:0;font-size:14px;color:#738099}
.display{display:flex;align-items:center;justify-content:center;gap:14px;height:58px;margin:22px 0 6px;border-radius:16px;background:#fff;border:1px solid #dbe5f4;box-shadow:inset 0 2px 6px rgba(23,52,95,.05)}
.display i{width:14px;height:14px;border-radius:50%;background:#1457c4;box-shadow:0 0 0 4px rgba(20,87,196,.14);animation:pop .12s ease-out}
.display .ph{width:12px;height:12px;border-radius:50%;background:#d5deec;animation:none;box-shadow:none}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.msg{min-height:22px;margin-bottom:10px;font-size:14px;font-weight:500;color:#e04b3c}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:64px;border:1px solid #e1e9f5;border-radius:18px;background:#fff;color:#10244a;font-size:26px;font-weight:600;box-shadow:0 4px 10px rgba(23,52,95,.06);transition:background .1s,transform .08s}
.pad button:active{background:#1457c4;color:#fff;transform:scale(.95)}
.pad .fn{background:#eef3fb;color:#5d6d8a;font-size:16px;box-shadow:none}
.pad .go{grid-column:1/-1;height:60px;margin-top:4px;border:0;border-radius:18px;color:#fff;font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(135deg,#1268d8,#4da3ff);box-shadow:0 14px 28px rgba(18,104,216,.32)}
.pad .go:active{background:#0f55b3}
.pad button:disabled{opacity:.5}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{position:absolute;left:0;right:0;bottom:0;padding:14px 24px;font-size:12px;color:#8a97ad;border-top:1px solid #e1e9f5;background:rgba(255,255,255,.6)}

@media (max-height:760px) and (min-width:761px){.side h2{font-size:38px}.logo{width:200px;margin-bottom:12px}.display{height:50px;margin-top:14px}.pad button{height:54px}.pad .go{height:54px}.pad{gap:10px}.side{padding-top:44px}}

/* HP: hero biru + lembar putih menumpuk */
@media (max-width:760px){
  .shell{display:flex;flex-direction:column}
  .side{flex:none;padding:calc(22px + env(safe-area-inset-top)) 20px 0}
  .side>div{padding-bottom:6px}
  .side h2{display:block;margin:8px 0 0;font-size:26px}
  .side h2::after{margin-top:12px;width:44px;height:2px}
  .side p{display:none}
  .scene{width:calc(100% + 40px);margin:8px -20px 0;max-height:min(150px,15vh)}
  .main{flex:1;min-height:0;margin-top:-12px;padding:18px 22px calc(16px + env(safe-area-inset-bottom));justify-content:space-between;border-radius:28px 28px 0 0;background:#fff;box-shadow:0 -12px 30px rgba(10,30,70,.25);position:relative;z-index:1}
  .box{max-width:360px;display:flex;flex-direction:column;flex:1;justify-content:flex-start}
  .logo,.hello{display:none}
  h1{margin:0;font-size:22px}
  .sub{margin-bottom:2px}
  .display{height:clamp(44px,6.5vh,52px);margin:10px 0 2px;background:#f4f8ff}
  .msg{flex:1;min-height:18px;display:flex;align-items:center;justify-content:center;margin:0}
  .pad{gap:10px}
  .pad button{height:clamp(40px,7.4vh,72px);border-radius:50px;font-size:25px}
  .pad .go{height:clamp(46px,7.8vh,66px);border-radius:50px}
  .foot{display:none}
}
</style>
</head>
